          private fun rect(cx: Float, cy: Float, w: Float, h: Float, col: Int) = Poly(
              floatArrayOf(cx - w / 2, cy - h / 2, cx + w / 2, cy - h / 2, cx + w / 2, cy + h / 2, cx - w / 2, cy + h / 2), col
