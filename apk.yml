name: apk
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Projeyi olustur
        run: |
          rm -rf app buildSrc gradle settings.gradle settings.gradle.kts build.gradle build.gradle.kts gradle.properties local.properties
          cat > settings.gradle.kts <<'EOFKT'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VRBoxAR"
          include(":app")
          EOFKT
          cat > build.gradle.kts <<'EOFKT'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOFKT
          cat > gradle.properties <<'EOFKT'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOFKT
          mkdir -p app
          cat > app/build.gradle.kts <<'EOFKT'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.vrbox.arhands"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.vrbox.arhands"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  ndk {
                      abiFilters += listOf("arm64-v8a", "armeabi-v7a")
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              androidResources {
                  noCompress += "task"
              }
          }

          dependencies {
              implementation("com.google.ar:core:1.45.0")
              implementation("com.google.mediapipe:tasks-vision:0.10.14")
          }
          EOFKT
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOFKT'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera.ar" android:required="true" />
              <uses-feature android:glEsVersion="0x00020000" android:required="true" />

              <application
                  android:allowBackup="false"
                  android:label="VR Box AR"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">

                  <meta-data android:name="com.google.ar.core" android:value="required" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOFKT
          mkdir -p app/src/main/java/com/vrbox/arhands
          cat > app/src/main/java/com/vrbox/arhands/MainActivity.kt <<'EOFKT'
          package com.vrbox.arhands

          import android.Manifest
          import android.app.Activity
          import android.content.pm.PackageManager
          import android.opengl.GLSurfaceView
          import android.os.Bundle
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.Toast
          import com.google.ar.core.ArCoreApk
          import com.google.ar.core.Config
          import com.google.ar.core.Session

          class MainActivity : Activity() {
              var session: Session? = null
              private lateinit var glView: GLSurfaceView
              private lateinit var renderer: ArRenderer
              private var installRequested = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  glView = GLSurfaceView(this)
                  glView.preserveEGLContextOnPause = true
                  glView.setEGLContextClientVersion(2)
                  glView.setEGLConfigChooser(8, 8, 8, 8, 16, 0)
                  renderer = ArRenderer(this)
                  glView.setRenderer(renderer)
                  glView.renderMode = GLSurfaceView.RENDERMODE_CONTINUOUSLY
                  glView.setOnTouchListener { _, e ->
                      if (e.action == MotionEvent.ACTION_DOWN) renderer.onTap(e.x, e.y)
                      true
                  }
                  setContentView(glView)
              }

              override fun onResume() {
                  super.onResume()
                  if (session == null) {
                      try {
                          val status = ArCoreApk.getInstance().requestInstall(this, !installRequested)
                          if (status == ArCoreApk.InstallStatus.INSTALL_REQUESTED) {
                              installRequested = true
                              return
                          }
                          if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                              requestPermissions(arrayOf(Manifest.permission.CAMERA), 1)
                              return
                          }
                          val s = Session(this)
                          val cfg = Config(s)
                          cfg.focusMode = Config.FocusMode.AUTO
                          s.configure(cfg)
                          session = s
                      } catch (e: Exception) {
                          Toast.makeText(this, "ARCore başlatılamadı: " + e.message, Toast.LENGTH_LONG).show()
                          finish()
                          return
                      }
                  }
                  try {
                      session?.resume()
                  } catch (e: Exception) {
                      Toast.makeText(this, "Kamera açılamadı: " + e.message, Toast.LENGTH_LONG).show()
                      finish()
                      return
                  }
                  glView.onResume()
              }

              override fun onPause() {
                  super.onPause()
                  glView.onPause()
                  session?.pause()
              }

              override fun onDestroy() {
                  renderer.tracker.close()
                  session?.close()
                  session = null
                  super.onDestroy()
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (grantResults.isEmpty() || grantResults[0] != PackageManager.PERMISSION_GRANTED) {
                      Toast.makeText(this, "Kamera izni gerekli", Toast.LENGTH_LONG).show()
                      finish()
                  }
              }

              @Suppress("DEPRECATION")
              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) {
                      window.decorView.systemUiVisibility = (View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          or View.SYSTEM_UI_FLAG_FULLSCREEN
                          or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY)
                  }
              }
          }
          EOFKT
